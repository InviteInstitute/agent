# Local development only: `docker compose up` merges this over compose.yml. The API reloads
# on every save, the Turnstile gate is off, and Postgres is reachable on 127.0.0.1:5435 so the
# tests can use it (TEST_DATABASE_URL in the Makefile).
services:
  db:
    ports:
      - "127.0.0.1:5435:5432"

  api:
    command: sh -c "python -m agent migrate && exec uvicorn agent.app:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      TURNSTILE: "off"
    volumes:
      - ./server/agent:/app/agent
      - ./server/migrations:/app/migrations

  # The client with hot reload on 127.0.0.1:5173. Vite passes /v1 on to the API.
  client:
    image: node:24-slim
    working_dir: /client
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./client:/client
      - /client/node_modules
      - ./avatar:/avatar:ro
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
