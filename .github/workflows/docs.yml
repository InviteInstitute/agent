name: Docs

# After every push to main, the docs bot brings the docs in step with the code
# (docs/guides/development.md). The bot is InviteInstitute/lm-dashboard's docs-bot.yml, shared
# with zany, atlas-invite and lm-dashboard, and .github/docs-bot.toml holds this repo's settings.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the docs commit to main

jobs:
  docs:
    uses: InviteInstitute/lm-dashboard/.github/workflows/docs-bot.yml@main
    secrets:
      LUMEN_API_KEY: ${{ secrets.LUMEN_API_KEY }}
