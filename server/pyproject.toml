[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
description = "The INVITE tutor's server: grounded feedback for students coding in VEXcode VR and ZANY."
requires-python = ">=3.12"
# The learner-model engine (and its apted dependency) is the agent-lm-packages submodule in
# vendor/, installed before this package (see the Dockerfile and the CI workflow).
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "openai==3.59.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
    # The tutor's voice (agent/speech.py): Paradee v1.2 pinned to its tag's commit as a tarball,
    # and the spaCy model its G2P loads, which it would otherwise download at runtime.
    "paradee @ https://github.com/sahilmahendrakar/paradee/archive/aae3cc46657bc69c6dbf9573bba556fb233f6bc0.tar.gz",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# misaki (Paradee's G2P) still uses an importlib.resources call deprecated in 3.11.
filterwarnings = ["ignore:open_text is deprecated:DeprecationWarning:misaki"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
